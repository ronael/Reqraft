sonar.projectKey=reqraft
sonar.projectName=Reqraft
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.{test,spec}.{ts,tsx}
sonar.exclusions=dist/**,coverage/**,benchmark-results/**,node_modules/**
sonar.coverage.exclusions=src/cli.tsx,src/version.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
