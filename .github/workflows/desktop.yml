name: Desktop installers

# Deliberately not on every push: producing three installers takes minutes and
# proves nothing a normal PR needs. `ci.yml` already builds the desktop bundle
# on every PR, which is what catches a broken build. This workflow exists to
# produce downloadable installers — on a release tag, or on demand.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach the installers to the GitHub Release for this version"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide whether the others build.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
            script: dist:desktop:mac
            artifact: reqraft-desktop-macos-arm64
          - os: windows-latest
            label: Windows x64
            script: dist:desktop:win
            artifact: reqraft-desktop-windows-x64
          - os: ubuntu-latest
            label: Linux x64
            script: dist:desktop:linux
            artifact: reqraft-desktop-linux-x64

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # An absent secret evaluates to an empty string, and an empty `CSC_LINK`
      # is not the same as no `CSC_LINK`: electron-builder treats it as "a
      # certificate was configured", then fails resolving it as a path. So the
      # signing variables are only exported when they actually hold something.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_SECRET: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signed=no

          if [ -n "${MAC_CSC_LINK}" ]; then
            {
              echo "CSC_LINK=${MAC_CSC_LINK}"
              echo "CSC_KEY_PASSWORD=${MAC_CSC_KEY_PASSWORD}"
              echo "APPLE_ID=${APPLE_ID_SECRET}"
              echo "APPLE_APP_SPECIFIC_PASSWORD=${APPLE_APP_SPECIFIC_PASSWORD_SECRET}"
              echo "APPLE_TEAM_ID=${APPLE_TEAM_ID_SECRET}"
            } >> "$GITHUB_ENV"
            signed=yes
          else
            # Stops electron-builder from picking up a keychain identity that
            # happens to be on the runner.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi

          if [ -n "${WIN_CSC_LINK_SECRET}" ]; then
            {
              echo "WIN_CSC_LINK=${WIN_CSC_LINK_SECRET}"
              echo "WIN_CSC_KEY_PASSWORD=${WIN_CSC_KEY_PASSWORD_SECRET}"
            } >> "$GITHUB_ENV"
            signed=yes
          fi

          echo "Code signing configured: ${signed}"

      - name: Build installer
        run: pnpm ${{ matrix.script }}

      # A zero-byte or missing installer must fail here rather than upload an
      # empty artifact that looks fine until someone downloads it.
      - name: Check the installer exists and is not empty
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/desktop/package/Reqraft-*.{dmg,zip,exe,AppImage})
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer produced in release/desktop/package"
            exit 1
          fi
          for file in "${files[@]}"; do
            size=$(wc -c < "$file")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$file is suspiciously small ($size bytes)"
              exit 1
            fi
            printf '%s  %s bytes\n' "$file" "$size"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/desktop/package/Reqraft-*.dmg
            release/desktop/package/Reqraft-*.zip
            release/desktop/package/Reqraft-*.exe
            release/desktop/package/Reqraft-*.AppImage
          # Long enough to download and test by hand, short enough not to
          # accumulate hundreds of megabytes of superseded builds.
          retention-days: 14
          if-no-files-found: error

  # Publication stays a separate job from building: a build that fails must not
  # be half-published, and a release can be re-attached without rebuilding.
  publish:
    name: Attach installers to the release
    needs: build
    runs-on: ubuntu-latest
    # All three platforms are attached, but they are not equal: only macOS has
    # been run by hand. Windows and Linux carry `-experimental` in their file
    # name and a warning in the release notes, so someone downloading one knows
    # what they are getting (docs/desktop-platform-support.md).
    if: startsWith(github.ref, 'refs/tags/v') || inputs.attach_to_release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          pattern: reqraft-desktop-*
          merge-multiple: true
          path: installers

      - name: Resolve the target tag
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Target release: ${tag}"

      - name: Upload the installers
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.target.outputs.tag }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::No GitHub Release for ${tag}. Create it first — this job attaches assets, it does not decide what a release is."
            exit 1
          fi
          ls -la installers/
          gh release upload "$tag" installers/* --clobber

      # The note lives in .github/desktop-release-note.md rather than inline:
      # a bash heredoc needs its terminator in column 0, which would break out
      # of this YAML block scalar. Keeping it in a file also means editing the
      # wording never touches the workflow.
      - name: Note which platforms are experimental
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.target.outputs.tag }}"
          note_file=.github/desktop-release-note.md
          marker="## Platform support"

          body=$(gh release view "$tag" --json body --jq .body)
          if printf '%s' "$body" | grep -qF "$marker"; then
            echo "Release already carries the platform note."
            exit 0
          fi

          { printf '%s\n\n' "$body"; cat "$note_file"; } | gh release edit "$tag" --notes-file -
