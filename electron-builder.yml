# Packaging desktop (DESKTOP.md lot 6).
#
# Durcissement et entitlements posés DÈS la première configuration (§5.10) :
# les ajouter après obligerait à tout resigner et renotariser.
#
# Chaque plateforme se construit sur son propre runner GitHub Actions
# (.github/workflows/desktop.yml) : electron-builder sait produire un AppImage
# depuis macOS, mais pas un installeur Windows signable ni un DMG depuis Linux.
# Un job par OS reste plus simple à lire qu'une cross-compilation partielle.
#
# Ce que chaque cible vaut réellement — buildable n'est pas supporté — est
# documenté dans docs/desktop-platform-support.md, qui fait foi.

appId: fr.reqraft.desktop
productName: Reqraft
copyright: Copyright © 2026 Reqraft Contributors

# Le package.json racine pointe sur le CLI npm ; l'app Electron démarre sur le
# bundle desktop (lot 6 : deux builds distincts, jamais un seul).
extraMetadata:
  main: release/desktop/bundle/main/index.mjs

# Sorties desktop confinées hors de `dist/`, que le package npm publie via
# `files: ["dist"]`. Par défaut electron-builder écrit dans `dist/`, ce qui
# faisait embarquer le .app entier dans @reqraft/cli : `output` ci-dessous est
# ce qui rend la fuite structurellement impossible.
directories:
  output: release/desktop/package
  buildResources: build

files:
  - release/desktop/bundle/**
  - package.json
  # Everything the app runs is bundled by tsup/Vite — the production
  # dependencies (opentui, react…) belong to the CLI surface and would only
  # bloat the asar.
  - "!node_modules/**"

# Tout est bundlé par tsup/Vite : aucune dépendance native à dépaqueter pour
# l'instant (osascript est un binaire système, pas un module). Si un module
# natif arrive (port Windows/Linux), l'ajouter à asarUnpack (lot 6, §5.3).
asar: true

# Nom stable et lisible : le nom du fichier téléchargé doit dire la version,
# l'OS et l'architecture sans avoir à l'ouvrir.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      # arm64 seulement : c'est l'architecture réellement testée à la main.
      # Ajouter x64 ou universal ici suffira le jour où l'un des deux aura été
      # validé — rien d'autre dans le pipeline n'en dépend.
      arch: [arm64]
    - target: zip
      arch: [arm64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation pilotée par le workflow : elle n'a de sens qu'une fois les
  # identifiants Apple présents, et une release officielle non signée doit
  # échouer plutôt que passer silencieusement (voir desktop.yml).
  notarize: false

dmg:
  title: Reqraft
  window:
    width: 540
    height: 380

win:
  target:
    - target: nsis
      # Pas de 32 bits : aucune machine cible connue n'en a besoin.
      arch: [x64]
  # Signature : electron-builder la déclenche dès que WIN_CSC_LINK et
  # WIN_CSC_KEY_PASSWORD existent dans l'environnement. Aucun certificat ni
  # mot de passe ne vit dans ce dépôt.

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Le suffixe vit dans le nom du fichier, pas seulement dans les notes de
  # release : c'est le nom qui reste sur le disque une fois la page oubliée.
  # Il tombera le jour où Windows sera validé à la main
  # (docs/desktop-platform-support.md).
  artifactName: ${productName}-${version}-win-${arch}-experimental.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  # Même raisonnement que pour Windows.
  artifactName: ${productName}-${version}-linux-${arch}-experimental.${ext}
  # deb/rpm/snap/flatpak délibérément absents : on les ajoutera si une demande
  # réelle apparaît, pas par anticipation.

# Mise à jour automatique : point d'extension `publish` volontairement absent.
# electron-updater viendra après une distribution fiable, pas avant.
