# Packaging macOS (DESKTOP.md lot 6).
#
# Durcissement et entitlements posés DÈS la première configuration (§5.10) :
# les ajouter après obligerait à tout resigner et renotariser.
#
# Signature et notarisation : actives dès que les secrets sont présents dans
# l'environnement (CSC_NAME ou CSC_LINK pour le certificat Developer ID,
# APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID pour la notarisation).
# Sans eux, electron-builder produit un binaire local non signé — utile pour
# tester le packaging, pas pour la distribution.

appId: fr.reqraft.desktop
productName: Reqraft
copyright: Copyright © 2026 Reqraft Contributors

# Le package.json racine pointe sur le CLI npm ; l'app Electron démarre sur le
# bundle desktop (lot 6 : deux builds distincts, jamais un seul).
extraMetadata:
  main: dist/desktop/main/index.mjs

files:
  - dist/desktop/**
  - package.json

# Tout est bundlé par tsup/Vite : aucune dépendance native à dépaqueter pour
# l'instant (osascript est un binaire système, pas un module). Si un module
# natif arrive (port Windows/Linux), l'ajouter à asarUnpack (lot 6, §5.3).
asar: true

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarisation active seulement si les identifiants Apple sont présents.
  notarize: false

dmg:
  title: Reqraft
  window:
    width: 540
    height: 380

# Mise à jour automatique : préparée (point d'extension `publish`) mais
# désactivée par défaut — aucun canal publish configuré (lot 6).
